<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City 3D — Open World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game, #hud { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar City 3D: an open-world city game. Walk, steal cars, outrun the police, run missions."></canvas>
<canvas id="hud"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
