<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar City — After Dark</title>
<style>
  html, body { margin: 0; padding: 0; background: #04060d; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(1280px, 100vw); aspect-ratio: 16 / 9; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #status {
    position: absolute; left: -9999px; top: auto; width: 1px; height: 1px; overflow: hidden;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <canvas id="hud" width="1280" height="720"></canvas>
  <p id="status" aria-live="polite">Loading Solmar City…</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
